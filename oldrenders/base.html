<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>World Network Monitor</title>
    <!-- Chart.js for Level 3 Dashboard -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
    <!-- ADDED: Font Awesome for new diagram icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas { 
            display: block; 
            transition: filter 0.5s ease;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }
        .congestion-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        /* Radar Analysis Window */
        #radarWindow {
            position: absolute;
            background: rgba(0, 20, 40, 0.95);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 15px;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            display: none;
            z-index: 1000;
            min-width: 280px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        
        .radar-header {
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px solid #00ffff;
            padding-bottom: 5px;
        }
        
        .radar-section { margin-bottom: 8px; }
        .radar-title { color: #ffff00; font-weight: bold; margin-bottom: 3px; }
        .cause-item { display: flex; justify-content: space-between; margin: 2px 0; padding: 2px 0; }
        .cause-name { color: #ffffff; }
        .cause-percentage { color: #ff6666; font-weight: bold; }
        .severity-critical { color: #ff3333; }
        .severity-high { color: #ff8800; }
        .severity-medium { color: #ffff00; }
        .radar-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        .scanning-line { color: #00ff00; animation: blink 1s infinite; }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0.3; } }

        /* --- Level 3 Datacenter View (DARK THEME) --- */
        #level3Overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0d1117; z-index: 2000; color: #c9d1d9;
            display: none; flex-direction: column; font-family: 'Courier New', monospace;
        }
        .l3-main-header {
            background: #161b22; padding: 10px 20px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .l3-tabs { display: flex; gap: 10px;}
        .l3-tab { padding: 8px 15px; border-bottom: 3px solid transparent; cursor: pointer; color: #8b949e; }
        .l3-tab.active { border-bottom-color: #f78166; color: #f0f6fc; font-weight: 600; }
        .l3-close-btn { background: #c9302c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .l3-close-btn:hover { background: #d9534f; }
        .l3-content-wrapper { flex-grow: 1; display: flex; padding: 15px; gap: 15px; overflow: hidden; }
        .l3-main-panel { flex-grow: 1; display: flex; flex-direction: column; background: #161b22; border: 1px solid #30363d; border-radius: 6px; }
        .l3-main-panel-header { padding: 10px 15px; border-bottom: 1px solid #30363d; font-weight: 600; color: #f0f6fc; }
        /* MODIFIED: Changed background to a flat color for clarity of the new diagram */
        .l3-network-map { flex-grow: 1; position: relative; background: #0d1117; padding: 20px;}
        
        .l3-right-panel {
            flex-basis: 320px; flex-shrink: 0; background: #161b22; border: 1px solid #30363d;
            border-radius: 6px; padding: 15px; font-size: 14px; color: #c9d1d9;
        }
        .l3-right-panel h3 { margin: 0 0 20px 0; font-size: 16px; border-bottom: 1px solid #30363d; padding-bottom: 10px; color: #f0f6fc; font-weight: 600;}
        .l3-insight-item { margin-bottom: 25px; }
        .l3-insight-title { color: #00ffff; font-size: 16px; margin: 0 0 8px 0; font-weight: bold; }
        .l3-insight-text { line-height: 1.5; font-size: 14px; }
        
        /* DEPRECATED: Old node styles are no longer used for the new diagram, but kept for potential future use */
        .l3-node { position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; color: #f0f6fc; }
        
        /* MODIFIED: Connection lines are now black/grey to match the diagram */
        .l3-connection-line { stroke-width: 1.5px; fill: none; stroke: #8b949e; marker-end: url(#arrowhead-new); }
        
        .l3-charts-container { flex-shrink: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 0 15px 15px 15px; height: 160px; }
        .l3-chart-wrapper { background: #161b22; padding: 10px; border: 1px solid #30363d; border-radius: 6px; }
        
        /* --- START: New Network Diagram Styles --- */
        .nd-group {
            position: absolute;
            border: 1px solid #8b949e;
            border-radius: 8px;
        }
        .nd-group-label {
            position: absolute;
            top: -10px;
            left: 15px;
            background: #0d1117;
            padding: 0 8px;
            font-size: 14px;
            font-weight: bold;
            color: #c9d1d9;
        }
        .nd-node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #c9d1d9;
        }
        .nd-icon {
            font-size: 24px;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nd-icon.fa-server { font-size: 30px; }
        .nd-icon.fa-cloud { font-size: 36px; color: #58a6ff; }
        .nd-icon.fa-lock { font-size: 20px; }
        .nd-icon.fa-database { font-size: 22px; }
        .nd-icon.fa-fire-wall { font-size: 40px; }
        .nd-label {
            font-size: 11px;
            margin-top: 4px;
            text-align: center;
            white-space: nowrap;
        }
        /* --- END: New Network Diagram Styles --- */
    </style>
</head>
<body>
    <div id="info">
        <div>World Network Monitor</div>
        <div id="status">Loading... (Double-click to reset view)</div>
    </div>
    
    <div id="radarWindow">
        <div class="radar-header radar-pulse">🔍 NETWORK RADAR ANALYSIS</div>
        <div id="radarContent"></div>
    </div>

    <!-- Level 3 Datacenter View Overlay -->
    <div id="level3Overlay">
        <header class="l3-main-header">
            <div class="l3-tabs">
                <div class="l3-tab">Dashboard</div>
                <div class="l3-tab active">Network Dashboard</div>
                <div class="l3-tab">Events</div>
                <div class="l3-tab">Top Business Transactions</div>
            </div>
            <button id="l3-close-btn" class="l3-close-btn">Return to Map</button>
        </header>
        <div class="l3-content-wrapper">
            <div class="l3-main-panel">
                <div class="l3-main-panel-header">
                    <span id="l3-title">Network Flow Map</span>
                </div>
                <div class="l3-network-map">
                    <svg width="100%" height="100%" id="l3-svg-container" style="position: absolute; top: 0; left: 0;">
                        <defs>
                            <!-- MODIFIED: New arrowhead for the new diagram -->
                            <marker id="arrowhead-new" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e" /></marker>
                        </defs>
                    </svg>
                    <!-- This container will be filled by JavaScript -->
                    <div id="l3-nodes-container" style="position: relative; width: 100%; height: 100%;"></div>
                </div>
            </div>
            <aside class="l3-right-panel">
                <h3>System Insights</h3>
                <div id="l3-ml-insights-content"></div>
            </aside>
        </div>
        <div class="l3-charts-container">
            <div class="l3-chart-wrapper"><canvas id="l3-chart-throughput"></canvas></div>
            <div class="l3-chart-wrapper"><canvas id="l3-chart-tcploss"></canvas></div>
            <div class="l3-chart-wrapper"><canvas id="l3-chart-pie"></canvas></div>
            <div class="l3-chart-wrapper"><canvas id="l3-chart-errors"></canvas></div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    
    <script>
        // --- THREE.JS Setup and Global Variables ---
        const scene = new THREE.Scene();
        const initialCameraPosition = new THREE.Vector3(0, 0, 120);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.copy(initialCameraPosition);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000011);
        document.body.appendChild(renderer.domElement);

        // --- State and Controls ---
        let mouseDown = false;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;
        let rotationX = 0, rotationY = 0;
        let currentLevel = 1; // 1: Global, 2: India Zoom, 3: Datacenter View
        let targetCameraPosition = new THREE.Vector3().copy(initialCameraPosition);
        let currentLookAt = new THREE.Vector3(0, 0, 0);
        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let activeCharts = []; // To hold Chart.js instances
        let animationState = 'idle'; // 'idle', 'centering', 'zooming'
        let zoomTargetMesh = null;


        // --- Groups for objects ---
        const mapGroup = new THREE.Group();
        const globalConnectionsGroup = new THREE.Group();
        const indiaConnectionsGroup = new THREE.Group();
        mapGroup.add(globalConnectionsGroup);
        mapGroup.add(indiaConnectionsGroup);
        scene.add(mapGroup);
        indiaConnectionsGroup.visible = false;

        // --- Raycasting ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- Data & Configuration ---
        const congestionLevels = ['low', 'medium', 'high', 'critical'];
        const activeLevels = ['medium', 'high', 'critical'];
        const congestionColors = {
            "low": new THREE.Color(0x888888),
            "medium": new THREE.Color(0xffff00),
            "high": new THREE.Color(0xff8800),
            "critical": new THREE.Color(0xff0000),
            "unknown": new THREE.Color(0x444444)
        };
        let targetColor = congestionColors['low'];
        let time = 0;
        let countryMeshes = [];
        let hoveredMesh = null;

        const congestionCauses = {
            'critical': [ { name: 'Faulty Hardware or Cables', min: 75, max: 95 }, { name: 'Traffic Overload', min: 60, max: 85 }, { name: 'Oversubscription', min: 40, max: 70 }, { name: 'Buffer Bloat', min: 30, max: 60 }, { name: 'Inadequate QoS (Quality of Service)', min: 25, max: 50 }, { name: 'Misconfigured Load Balancers or Routing', min: 20, max: 45 }, { name: 'Slow-Receiver or End Device', min: 15, max: 40 }, { name: 'Microbursts', min: 10, max: 35 } ],
            'high': [ { name: 'Traffic Overload', min: 50, max: 75 }, { name: 'Buffer Bloat', min: 35, max: 65 }, { name: 'Oversubscription', min: 30, max: 55 }, { name: 'Slow-Receiver or End Device', min: 25, max: 50 }, { name: 'Inadequate QoS (Quality of Service)', min: 20, max: 45 }, { name: 'Misconfigured Load Balancers or Routing', min: 15, max: 35 }, { name: 'Faulty Hardware or Cables', min: 10, max: 30 }, { name: 'Microbursts', min: 8, max: 25 } ],
            'medium': [ { name: 'Traffic Overload', min: 30, max: 50 }, { name: 'Buffer Bloat', min: 20, max: 40 }, { name: 'Slow-Receiver or End Device', min: 15, max: 35 }, { name: 'Inadequate QoS (Quality of Service)', min: 10, max: 30 }, { name: 'Microbursts', min: 8, max: 25 }, { name: 'Oversubscription', min: 5, max: 20 }, { name: 'Misconfigured Load Balancers or Routing', min: 5, max: 18 }, { name: 'Faulty Hardware or Cables', min: 3, max: 15 } ]
        };
        const locationNames = [ 'Data Center Alpha', 'Regional Hub Beta', 'Metro Node Gamma', 'Edge Router Delta', 'Core Switch Epsilon', 'Access Point Zeta', 'Gateway Eta', 'Relay Station Theta', 'Network Cluster Iota', 'Backbone Node Kappa', 'Distribution Point Lambda', 'Service Node Mu' ];
        
        // This data is now generic, as the diagram is static
        const genericInsights = {
            mlInsights: [
                { title: 'System Status', text: 'All systems are reporting nominal performance. No active alerts.' },
                { title: 'Security Posture', text: 'Firewall is actively filtering traffic. No intrusion attempts detected in the last hour.' },
                { title: 'Connectivity Health', text: 'External and internal network links show stable latency and packet delivery.' }
            ]
        };

        // --- Event Listeners Setup ---
        document.addEventListener('mousedown', onMouseDown, false);
        document.addEventListener('mousemove', onMouseMove, false);
        document.addEventListener('mouseup', onMouseUp, false);
        document.addEventListener('wheel', onWheel, false);
        document.addEventListener('dblclick', resetView, false);
        document.getElementById('l3-close-btn').addEventListener('click', hideLevel3View);

        // --- Core Event Handlers ---
        function onMouseDown(event) {
            if (currentLevel === 3) return;
            mouseDown = true;
            mouseX = event.clientX;
            mouseY = event.clientY;
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            if (!mouseDown) {
                if (currentLevel === 1) checkHover(event);
                return;
            }
            if (currentLevel !== 1 || animationState !== 'idle') return;

            const deltaX = event.clientX - mouseX;
            const deltaY = event.clientY - mouseY;
            targetRotationY += deltaX * 0.01;
            targetRotationX += deltaY * 0.01;
            targetRotationX = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotationX));
            mouseX = event.clientX;
            mouseY = event.clientY;
        }

        function onMouseUp(event) {
            if (!mouseDown || currentLevel === 3) return;
            mouseDown = false;
            
            const deltaX = event.clientX - mouseX;
            const deltaY = event.clientY - mouseY;
            const dragDistance = Math.sqrt(deltaX*deltaX + deltaY*deltaY);

            if (dragDistance < 5) handleClick();
        }
        
        function handleClick() {
            if (animationState !== 'idle') return;
            raycaster.setFromCamera(mouse, camera);

            if (currentLevel === 1) {
                const intersects = raycaster.intersectObjects(countryMeshes);
                if (intersects.length > 0) {
                    const clickedMesh = intersects[0].object;
                    if (clickedMesh.userData.name === 'India') {
                        zoomToCountry(clickedMesh);
                    }
                }
            } else if (currentLevel === 2) {
                const nodeIntersects = raycaster.intersectObjects(indiaConnectionsGroup.children);
                const countryIntersects = raycaster.intersectObjects(countryMeshes);
                
                const clickedNode = nodeIntersects.find(i => i.object.userData.isNode);
                if (clickedNode) {
                    showLevel3View(clickedNode.object.userData.name); // Pass name for title
                } else if (countryIntersects.length === 0) {
                     resetView();
                }
            }
        }

        function zoomToCountry(countryMesh) {
            if (currentLevel !== 1 || animationState !== 'idle') return;
            
            hideRadarWindow();
            animationState = 'centering';
            zoomTargetMesh = countryMesh;

            targetRotationX = 0;
            targetRotationY = 0;
        }

        function resetView() {
            if (currentLevel === 1 && camera.position.equals(initialCameraPosition)) return;
            hideLevel3View();
            currentLevel = 1;

            targetCameraPosition.copy(initialCameraPosition);
            targetLookAt.set(0, 0, 0);

            globalConnectionsGroup.visible = true;
            indiaConnectionsGroup.visible = false;
            
            animationState = 'idle';
            zoomTargetMesh = null;

            updateStatus('Global View. Monitoring all networks.');
        }

        function onWheel(event) {
            if (currentLevel !== 1) return;
            camera.position.z += event.deltaY * 0.1;
            camera.position.z = Math.max(50, Math.min(300, camera.position.z));
            targetCameraPosition.z = camera.position.z;
        }
        
        // --- Radar Window Functions ---
        function checkHover(event) {
            if (animationState !== 'idle') return;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(countryMeshes);
            
            if (intersects.length > 0) {
                const mesh = intersects[0].object;
                
                if (mesh.userData.hasDevices && (mesh.userData.congestionLevel === 'high' || mesh.userData.congestionLevel === 'critical')) {
                    if (hoveredMesh !== mesh) {
                        hoveredMesh = mesh;
                        showRadarWindow(event.clientX, event.clientY, mesh);
                    } else {
                        updateRadarPosition(event.clientX, event.clientY);
                    }
                } else {
                    hideRadarWindow();
                }
            } else {
                hideRadarWindow();
            }
        }

        function showRadarWindow(x, y, mesh) {
            const radarWindow = document.getElementById('radarWindow');
            const radarContent = document.getElementById('radarContent');
            const level = mesh.userData.congestionLevel;
            const causes = congestionCauses[level] || [];
            const locationName = locationNames[Math.floor(Math.random() * locationNames.length)];
            const analysisData = causes.slice(0, 4 + Math.floor(Math.random() * 2)).map(cause => ({ name: cause.name, percentage: Math.floor(Math.random() * (cause.max - cause.min) + cause.min) })).sort((a, b) => b.percentage - a.percentage);
            const severityClass = `severity-${level}`;
            const timestamp = new Date().toLocaleTimeString();
            
            radarContent.innerHTML = `
                <div class="radar-section"><div class="radar-title">📍 LOCATION</div><div class="cause-item"><span class="cause-name">${locationName}</span><span class="scanning-line">● SCANNING</span></div></div>
                <div class="radar-section"><div class="radar-title">⚠️ SEVERITY</div><div class="cause-item"><span class="cause-name">Congestion Level</span><span class="cause-percentage ${severityClass}">${level.toUpperCase()}</span></div></div>
                <div class="radar-section"><div class="radar-title">🔍 ROOT CAUSE ANALYSIS</div>${analysisData.map(item => `<div class="cause-item"><span class="cause-name">${item.name}</span><span class="cause-percentage">${item.percentage}%</span></div>`).join('')}</div>
                <div class="radar-section"><div class="radar-title">⏱️ LAST SCAN</div><div class="cause-item"><span class="cause-name">Timestamp</span><span class="cause-percentage">${timestamp}</span></div></div>`;
            
            radarWindow.style.display = 'block';
            updateRadarPosition(x, y);
        }

        function updateRadarPosition(x, y) {
            const radarWindow = document.getElementById('radarWindow');
            let posX = x + 20, posY = y + 10;
            const rect = radarWindow.getBoundingClientRect();
            if (posX + rect.width > window.innerWidth - 10) posX = x - rect.width - 20;
            if (posY + rect.height > window.innerHeight - 10) posY = y - rect.height - 10;
            radarWindow.style.left = posX + 'px';
            radarWindow.style.top = posY + 'px';
        }

        function hideRadarWindow() {
            document.getElementById('radarWindow').style.display = 'none';
            hoveredMesh = null;
        }

        // --- MODIFIED: Level 3 View Function ---
        function showLevel3View(datacenterName) {
            currentLevel = 3;
            renderer.domElement.style.filter = 'blur(5px) brightness(0.7)';

            const overlay = document.getElementById('level3Overlay');
            const title = document.getElementById('l3-title');
            const nodesContainer = document.getElementById('l3-nodes-container');
            const svgContainer = document.getElementById('l3-svg-container');
            const insightsContainer = document.getElementById('l3-ml-insights-content');
            
            // --- Clear previous state ---
            nodesContainer.innerHTML = '';
            insightsContainer.innerHTML = '';
            while (svgContainer.lastChild.nodeName !== 'defs') {
                svgContainer.removeChild(svgContainer.lastChild);
            }
            if (activeCharts.length) {
                activeCharts.forEach(c => c.destroy());
                activeCharts = [];
            }
            
            // --- Populate with new diagram content ---
            title.textContent = `Hospital Network Diagram (${datacenterName} Campus)`;
            
            // Populate Generic Insights Panel
            genericInsights.mlInsights.forEach(insight => {
                const insightEl = document.createElement('div');
                insightEl.className = 'l3-insight-item';
                insightEl.innerHTML = `
                    <div class="l3-insight-title">${insight.title}</div>
                    <div class="l3-insight-text">${insight.text}</div>
                `;
                insightsContainer.appendChild(insightEl);
            });

            // Populate the diagram using static HTML
            nodesContainer.innerHTML = `
                <!-- External/Internet Zone -->
                <div id="ext-web-citrix" class="nd-node" style="left: 5%; top: 75%;"><div class="nd-icon"><i class="fa-solid fa-desktop"></i></div><div class="nd-label">External Review<br>via Citrix</div></div>
                <div id="ext-web-browser" class="nd-node" style="left: 5%; top: 55%;"><div class="nd-icon"><i class="fa-solid fa-desktop"></i></div><div class="nd-label">External Web<br>Browser Review</div></div>
                <div id="ext-cell" class="nd-node" style="left: 5%; top: 35%;"><div class="nd-icon"><i class="fa-solid fa-mobile-screen"></i></div><div class="nd-label">Cell Phone<br>Review</div></div>
                <div id="ext-tablet" class="nd-node" style="left: 5%; top: 15%;"><div class="nd-icon"><i class="fa-solid fa-tablet-screen-button"></i></div><div class="nd-label">Tablet<br>Review</div></div>
                <div id="internet-cloud" class="nd-node" style="left: 18%; top: 45%;"><div class="nd-icon"><i class="fa-solid fa-cloud"></i></div><div class="nd-label">Internet</div></div>

                <!-- Firewall -->
                <div id="firewall" class="nd-node" style="left: 30%; top: 45%;"><div class="nd-icon"><i class="fa-solid fa-fire-wall"></i></div><div class="nd-label">Firewall</div></div>

                <!-- Internal Network: Left Side -->
                <div id="vpn" class="nd-node" style="left: 42%; top: 18%;"><div class="nd-icon"><i class="fa-solid fa-lock"></i></div><div class="nd-label">VPN</div></div>
                <div id="mobile-server" class="nd-node" style="left: 48%; top: 10%;"><div class="nd-icon"><i class="fa-solid fa-server"></i></div><div class="nd-label">Persyst Mobile<br>Server</div></div>
                <div id="web-browser-review" class="nd-node" style="left: 48%; top: 1%;"><div class="nd-icon"><i class="fa-solid fa-desktop"></i></div><div class="nd-label">Web Browser<br>Review</div></div>
                <div id="tablet-review" class="nd-node" style="left: 60%; top: 10%;"><div class="nd-icon"><i class="fa-solid fa-tablet-screen-button"></i></div><div class="nd-label">Tablet<br>Review</div></div>
                
                <!-- Internal Network: Center -->
                <div id="doctor-review" class="nd-node" style="left: 48%; top: 35%;"><div class="nd-icon"><i class="fa-solid fa-desktop"></i></div><div class="nd-label">Doctor's Review<br>via Citrix</div></div>
                <div id="file-server" class="nd-node" style="left: 68%; top: 45%;"><div class="nd-icon"><i class="fa-solid fa-database"></i></div><div class="nd-label">File Server</div></div>
                <div id="mpm" class="nd-node" style="left: 60%; top: 25%;"><div class="nd-icon"><i class="fa-solid fa-display"></i></div><div class="nd-label">Multi-Patient<br>Monitor (MPM)</div></div>

                <!-- Reading Room Group -->
                <div class="nd-group" style="left: 40%; top: 58%; width: 40%; height: 40%;"><div class="nd-group-label">Reading Room</div></div>

            ];

            connections.forEach(conn => {
                const fromNode = document.getElementById(conn.from);
                const toNode = document.getElementById(conn.to);
                if (!fromNode || !toNode) {
                    console.warn('Could not find nodes for connection:', conn);
                    return;
                }

                const fromRect = fromNode.getBoundingClientRect();
                const toRect = toNode.getBoundingClientRect();
                
                // Calculate center points relative to the map container
                const x1 = fromRect.left + fromRect.width / 2 - mapRect.left;
                const y1 = fromRect.top + fromRect.height / 2 - mapRect.top;
                const x2 = toRect.left + toRect.width / 2 - mapRect.left;
                const y2 = toRect.top + toRect.height / 2 - mapRect.top;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                line.setAttribute('d', `M${x1},${y1} L${x2},${y2}`);
                line.setAttribute('class', `l3-connection-line`);
                svgContainer.appendChild(line);
            });
        }

        // --- Map Loading & Drawing Functions ---
        async function loadWorldMap() {
            try {
                const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
                const topology = await response.json();
                const countries = topojson.feature(topology, topology.objects.countries);
                drawMap(countries);
                updateStatus('Map loaded - Monitoring congestion...');
                startCongestionSimulation();
            } catch (error) {
                console.error('Error loading map:', error);
                updateStatus('Error loading map data');
            }
        }

        function drawMap(geojson) {
            geojson.features.forEach((feature) => {
                if (feature.geometry.type === 'Polygon') {
                    createCountryMesh(feature.geometry.coordinates, feature.properties);
                } else if (feature.geometry.type === 'MultiPolygon') {
                    feature.geometry.coordinates.forEach((polygon) => {
                        createCountryMesh(polygon, feature.properties);
                    });
                }
            });
        }
        
        function splitAntimeridianPolygon(coordinates) {
            const groups = [];
            let currentGroup = [];
            
            for (let i = 0; i < coordinates.length; i++) {
                const [lng, lat] = coordinates[i];
                const prevCoord = i > 0 ? coordinates[i - 1] : null;
                
                if (prevCoord) {
                    const [prevLng] = prevCoord;
                    if (Math.abs(lng - prevLng) > 180) {
                        if (currentGroup.length > 2) {
                            groups.push([...currentGroup]);
                        }
                        currentGroup = [];
                    }
                }
                currentGroup.push([lng, lat]);
            }
            
            if (currentGroup.length > 2) {
                groups.push(currentGroup);
            }
            
            return groups.length > 0 ? groups : [coordinates];
        }

        function createCountryMesh(coordinates, properties) {
            coordinates.forEach(ring => {
                if (ring.length < 3) return;
                const polygonGroups = splitAntimeridianPolygon(ring);

                polygonGroups.forEach(coordGroup => {
                    if (coordGroup.length < 3) return;
                    const shape = new THREE.Shape();
                    coordGroup.forEach(([lng, lat], index) => {
                        if (index === 0) shape.moveTo(lng, lat);
                        else shape.lineTo(lng, lat);
                    });
                    
                    const hasDevices = Math.random() > 0.3;
                    let initialColor, initialLevel;
                    if (hasDevices) {
                        initialLevel = activeLevels[Math.floor(Math.random() * activeLevels.length)];
                        initialColor = congestionColors[initialLevel];
                    } else {
                        initialLevel = 'low';
                        initialColor = congestionColors['low'];
                    }
                    
                    const geometry = new THREE.ShapeGeometry(shape);
                    const material = new THREE.MeshBasicMaterial({ color: initialColor, transparent: true, opacity: hasDevices ? 0.7 : 0.3, side: THREE.DoubleSide });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.userData = { 
                        name: properties.name, 
                        originalColor: new THREE.Color().copy(initialColor),
                        currentColor: new THREE.Color().copy(initialColor),
                        targetColor: initialColor,
                        congestionLevel: initialLevel,
                        hasDevices: hasDevices
                    };
                    mapGroup.add(mesh);
                    countryMeshes.push(mesh);
                });
            });
        }
        
        // --- Simulation & Status Update Functions ---
        function startCongestionSimulation() {
            setInterval(() => {
                assignRandomCongestion();
            }, 6000);
        }

        function assignRandomCongestion() {
            countryMeshes.forEach(mesh => {
                if (mesh.userData.hasDevices) {
                    const randomLevel = activeLevels[Math.floor(Math.random() * activeLevels.length)];
                    mesh.userData.targetColor = congestionColors[randomLevel];
                    mesh.userData.congestionLevel = randomLevel;
                }
            });
        }

        function updateStatus(message) {
            const statusElement = document.getElementById('status');
            const indicator = `<span class="congestion-indicator" style="background-color: ${targetColor.getStyle()}"></span>`;
            statusElement.innerHTML = indicator + message;
        }

        function getRandomActiveColor() {
            const randomLevel = activeLevels[Math.floor(Math.random() * activeLevels.length)];
            return congestionColors[randomLevel].clone();
        }

        // --- Main Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            time += 0.02;

            if (animationState === 'centering') {
                const rotationLerpFactor = 0.1; 
                rotationX += (targetRotationX - rotationX) * rotationLerpFactor;
                rotationY += (targetRotationY - rotationY) * rotationLerpFactor;
                mapGroup.rotation.x = rotationX;
                mapGroup.rotation.y = rotationY;

                if (Math.abs(rotationX) < 0.01 && Math.abs(rotationY) < 0.01) {
                    rotationX = 0; rotationY = 0;
                    mapGroup.rotation.x = 0; mapGroup.rotation.y = 0;
                    
                    animationState = 'zooming';
                    currentLevel = 2;
                    
                    const boundingBox = new THREE.Box3().setFromObject(zoomTargetMesh);
                    const center = boundingBox.getCenter(new THREE.Vector3());
                    const size = boundingBox.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    
                    targetCameraPosition.copy(center).add(new THREE.Vector3(0, 0, maxDim * 1.8));
                    targetLookAt.copy(center);

                    globalConnectionsGroup.visible = false;
                    indiaConnectionsGroup.visible = true;
                    updateStatus(`Zoomed into: ${zoomTargetMesh.userData.name}. Click a node for details.`);
                }
            } else if (animationState === 'zooming') {
                const cameraLerpFactor = 0.15;
                camera.position.lerp(targetCameraPosition, cameraLerpFactor);
                currentLookAt.lerp(targetLookAt, cameraLerpFactor);
                camera.lookAt(currentLookAt);

                if (camera.position.distanceTo(targetCameraPosition) < 0.1) {
                    camera.position.copy(targetCameraPosition);
                    currentLookAt.copy(targetLookAt);
                    camera.lookAt(currentLookAt);
                    animationState = 'idle';
                    zoomTargetMesh = null;
                }
            } else { // 'idle' state
                const cameraLerpFactor = 0.15;
                camera.position.lerp(targetCameraPosition, cameraLerpFactor);
                currentLookAt.lerp(targetLookAt, cameraLerpFactor);
                camera.lookAt(currentLookAt);
                
                if (currentLevel === 1) {
                    const rotationLerpFactor = 0.2;
                    rotationX += (targetRotationX - rotationX) * rotationLerpFactor;
                    rotationY += (targetRotationY - rotationY) * rotationLerpFactor;
                    mapGroup.rotation.x = rotationX;
                    mapGroup.rotation.y = rotationY;
                }
            }
            
            countryMeshes.forEach((mesh, index) => {
                if (mesh.userData.hasDevices) {
                    const phase = (index * 0.1) % (Math.PI * 2);
                    const localPulse = 0.7 + 0.3 * Math.sin(time * 0.5 + phase);
                    mesh.userData.currentColor.lerp(mesh.userData.targetColor, 0.03);
                    const baseColor = mesh.userData.currentColor.clone();
                    const brightColor = baseColor.clone().multiplyScalar(1.3);
                    const dimColor = baseColor.clone().multiplyScalar(0.7);
                    const breathingColor = dimColor.clone().lerp(brightColor, localPulse);
                    mesh.material.color.copy(breathingColor);
                    mesh.material.opacity = 0.5 + 0.2 * localPulse;
                } else {
                    mesh.material.opacity = 0.3;
                }
            });
            
            const allLines = [...globalConnectionsGroup.children, ...indiaConnectionsGroup.children].filter(c => c.type === "Line");
            allLines.forEach((line, index) => {
                const phase = (index * 0.1) % (Math.PI * 2);
                const localPulse = 0.7 + 0.3 * Math.sin(time * 0.5 + phase);
                line.userData.currentColor.lerp(line.userData.targetColor, 0.03);
                const baseColor = line.userData.currentColor.clone();
                const breathingColor = baseColor.clone().lerp(baseColor.clone().multiplyScalar(1.3), localPulse);
                line.material.color.copy(breathingColor);
            });
            
            renderer.render(scene, camera);
        }

        // --- Window Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Connection Data & Creation ---
        const globalConnections= [
            { from: { lon: -74, lat: 40, name: 'New York' }, to: { lon: 2, lat: 48, name: 'Paris' } },
            { from: { lon: 2, lat: 48, name: 'Paris' }, to: { lon: 139, lat: 35, name: 'Tokyo' } },
            { from: { lon: 139, lat: 35, name: 'Tokyo' }, to: { lon: -74, lat: 40, name: 'New York' } },
            { from: { lon: -74, lat: 40, name: 'New York' }, to: { lon: -0.1, lat: 51.5, name: 'London' } },
            { from: { lon: -0.1, lat: 51.5, name: 'London' }, to: { lon: 151, lat: -33, name: 'Sydney' } },
            { from: { lon: 151, lat: -33, name: 'Sydney' }, to: { lon: 116, lat: 40, name: 'Beijing' } },
            { from: { lon: 116, lat: 40, name: 'Beijing' }, to: { lon: 37, lat: 55, name: 'Moscow' } },
            { from: { lon: 37, lat: 55, name: 'Moscow' }, to: { lon: -58, lat: -34, name: 'Buenos Aires' } },
            { from: { lon: -58, lat: -34, name: 'Buenos Aires' }, to: { lon: -123, lat: 49, name: 'Vancouver' } },
            { from: { lon: -123, lat: 49, name: 'Vancouver' }, to: { lon: -74, lat: 40, name: 'New York' } },
            { from: { lon: 77, lat: 28, name: 'Delhi' }, to: { lon: 139, lat: 35, name: 'Tokyo' } },
            { from: { lon: 77, lat: 28, name: 'Delhi' }, to: { lon: -0.1, lat: 51.5, name: 'London' } },
            { from: { lon: -3.7, lat: 40, name: 'Madrid' }, to: { lon: 151, lat: -33, name: 'Sydney' } },
            { from: { lon: 151, lat: -33, name: 'Sydney' }, to: { lon: -74, lat: 40, name: 'New York' } }
        ];
        const indiaConnections = [
            { from: { lon: 73.85, lat: 18.52, name: 'Pune' }, to: { lon: 77.59, lat: 12.97, name: 'Bangalore' } },
            { from: { lon: 77.59, lat: 12.97, name: 'Bangalore' }, to: { lon: 80.27, lat: 13.08, name: 'Chennai' } },
            { from: { lon: 80.27, lat: 13.08, name: 'Chennai' }, to: { lon: 88.36, lat: 22.57, name: 'Kolkata' } },
            { from: { lon: 88.36, lat: 22.57, name: 'Kolkata' }, to: { lon: 77.20, lat: 28.61, name: 'Delhi' } },
            { from: { lon: 77.20, lat: 28.61, name: 'Delhi' }, to: { lon: 72.87, lat: 19.07, name: 'Mumbai' } },
            { from: { lon: 72.87, lat: 19.07, name: 'Mumbai' }, to: { lon: 73.85, lat: 18.52, name: 'Pune' } },
            { from: { lon: 77.20, lat: 28.61, name: 'Delhi' }, to: { lon: 77.59, lat: 12.97, name: 'Bangalore' } },
        ];

        function lonLatToPlane(lon, lat) { return new THREE.Vector3(lon, lat, 0.1); }

        function createGlowingNode(position, name, group) {
            const geometry = new THREE.SphereGeometry(0.8, 16, 16);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.copy(position);
            sphere.userData = { name: name, isNode: true };
            group.add(sphere);
        }

        function createConnectionLine(from, to, group) {
            const start = lonLatToPlane(from.lon, from.lat);
            const end = lonLatToPlane(to.lon, to.lat);
            const mid = start.clone().lerp(end, 0.5);
            mid.z += start.distanceTo(end) * 0.2;
            const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
            const points = curve.getPoints(50);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const lineColor = getRandomActiveColor();
            const material = new THREE.LineBasicMaterial({ color: lineColor, linewidth: 2, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false });
            const line = new THREE.Line(geometry, material);
            line.userData = { currentColor: lineColor.clone(), targetColor: getRandomActiveColor() };
            group.add(line);
            
            const nodesInGroup = group.children.filter(c => c.userData.isNode);
            if (from.name && !nodesInGroup.some(n => n.userData.name === from.name)) createGlowingNode(start, from.name, group);
            if (to.name && !nodesInGroup.some(n => n.userData.name === to.name)) createGlowingNode(end, to.name, group);
        }

        setInterval(() => {
            const allLines = [...globalConnectionsGroup.children, ...indiaConnectionsGroup.children].filter(c => c.type === 'Line');
            allLines.forEach(line => {
                if (line.userData) line.userData.targetColor = getRandomActiveColor();
            });
        }, 5000);

        // --- Initialize Application ---
        loadWorldMap();
        globalConnections.forEach(conn => createConnectionLine(conn.from, conn.to, globalConnectionsGroup));
        indiaConnections.forEach(conn => createConnectionLine(conn.from, conn.to, indiaConnectionsGroup));
        animate();

    </script>
