<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js World Heatmap with Breathing Effect & Radar Analysis</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .congestion-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        /* Radar Analysis Window */
        #radarWindow {
            position: absolute;
            background: rgba(0, 20, 40, 0.95);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 15px;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            display: none;
            z-index: 1000;
            min-width: 280px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        
        #radarWindow::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 20px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid #00ffff;
        }
        
        .radar-header {
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px solid #00ffff;
            padding-bottom: 5px;
        }
        
        .radar-section {
            margin-bottom: 8px;
        }
        
        .radar-title {
            color: #ffff00;
            font-weight: bold;
            margin-bottom: 3px;
        }
        
        .cause-item {
            display: flex;
            justify-content: space-between;
            margin: 2px 0;
            padding: 2px 0;
        }
        
        .cause-name {
            color: #ffffff;
        }
        
        .cause-percentage {
            color: #ff6666;
            font-weight: bold;
        }
        
        .severity-critical { color: #ff3333; }
        .severity-high { color: #ff8800; }
        .severity-medium { color: #ffff00; }
        
        .radar-pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
        
        .scanning-line {
            color: #00ff00;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="info">
        <div>World Network Congestion Monitor</div>
        <div id="status">Loading...</div>
    </div>
    
    <div id="radarWindow">
        <div class="radar-header radar-pulse">🔍 NETWORK RADAR ANALYSIS</div>
        <div id="radarContent"></div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000011);
        document.body.appendChild(renderer.domElement);

        // Raycaster for mouse interactions
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Simple orbit controls implementation
        let mouseDown = false;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;
        let rotationX = 0, rotationY = 0;

        const mapGroup = new THREE.Group();
        scene.add(mapGroup);

        // Congestion levels and colors
        const congestionLevels = ['low', 'medium', 'high', 'critical'];
        const congestionColors = {
            "low": new THREE.Color(0x888888),      // Gray
            "medium": new THREE.Color(0xffff00),   // Yellow  
            "high": new THREE.Color(0xff8800),     // Orange
            "critical": new THREE.Color(0xff0000), // Red
            "unknown": new THREE.Color(0x444444)   // Dark Grey
        };

        let currentCongestionLevel = 'low';
        let targetColor = congestionColors[currentCongestionLevel];
        let currentColor = new THREE.Color().copy(targetColor);
        let time = 0;
        let countryMeshes = [];
        let hoveredMesh = null;

        // Possible congestion causes with dynamic ranges
        const congestionCauses = {
            'critical': [
                { name: 'Bandwidth Saturation', min: 75, max: 95 },
                { name: 'DDoS Attack Detected', min: 60, max: 85 },
                { name: 'Hardware Failure', min: 40, max: 70 },
                { name: 'Routing Loops', min: 30, max: 60 },
                { name: 'DNS Resolution Issues', min: 25, max: 50 },
                { name: 'ISP Peering Problems', min: 20, max: 45 }
            ],
            'high': [
                { name: 'High Traffic Volume', min: 50, max: 75 },
                { name: 'Link Degradation', min: 35, max: 65 },
                { name: 'BGP Instability', min: 30, max: 55 },
                { name: 'Server Overload', min: 25, max: 50 },
                { name: 'Network Congestion', min: 20, max: 45 },
                { name: 'QoS Policy Issues', min: 15, max: 35 }
            ],
            'medium': [
                { name: 'Peak Hour Traffic', min: 30, max: 50 },
                { name: 'Routing Inefficiency', min: 20, max: 40 },
                { name: 'Protocol Overhead', min: 15, max: 35 },
                { name: 'Cache Miss Rate', min: 10, max: 30 },
                { name: 'Latency Spikes', min: 8, max: 25 },
                { name: 'Packet Loss', min: 5, max: 20 }
            ]
        };

        // Generate location names
        const locationNames = [
            'Data Center Alpha', 'Regional Hub Beta', 'Metro Node Gamma', 'Edge Router Delta',
            'Core Switch Epsilon', 'Access Point Zeta', 'Gateway Eta', 'Relay Station Theta',
            'Network Cluster Iota', 'Backbone Node Kappa', 'Distribution Point Lambda', 'Service Node Mu'
        ];

        // Mouse controls
        document.addEventListener('mousedown', onMouseDown, false);
        document.addEventListener('mousemove', onMouseMove, false);
        document.addEventListener('mouseup', onMouseUp, false);
        document.addEventListener('wheel', onWheel, false);

        function onMouseDown(event) {
            mouseDown = true;
            mouseX = event.clientX;
            mouseY = event.clientY;
        }

        function onMouseMove(event) {
            // Update mouse position for raycasting
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            if (!mouseDown) {
                checkHover(event);
                return;
            }
            
            const deltaX = event.clientX - mouseX;
            const deltaY = event.clientY - mouseY;
            
            targetRotationY += deltaX * 0.01;
            targetRotationX += deltaY * 0.01;
            
            targetRotationX = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotationX));
            
            mouseX = event.clientX;
            mouseY = event.clientY;
        }

        function onMouseUp(event) {
            mouseDown = false;
        }

        function onWheel(event) {
            camera.position.z += event.deltaY * 0.1;
            camera.position.z = Math.max(50, Math.min(300, camera.position.z));
        }

        function checkHover(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(countryMeshes);
            
            if (intersects.length > 0) {
                const mesh = intersects[0].object;
                
                // Only show radar for congested areas (high or critical)
                if (mesh.userData.hasDevices && 
                    (mesh.userData.congestionLevel === 'high' || mesh.userData.congestionLevel === 'critical')) {
                    
                    if (hoveredMesh !== mesh) {
                        hoveredMesh = mesh;
                        showRadarWindow(event.clientX, event.clientY, mesh);
                    } else {
                        updateRadarPosition(event.clientX, event.clientY);
                    }
                } else {
                    hideRadarWindow();
                }
            } else {
                hideRadarWindow();
            }
        }

        function showRadarWindow(x, y, mesh) {
            const radarWindow = document.getElementById('radarWindow');
            const radarContent = document.getElementById('radarContent');
            
            // Generate analysis data
            const level = mesh.userData.congestionLevel;
            const causes = congestionCauses[level] || congestionCauses['medium'];
            const locationName = locationNames[Math.floor(Math.random() * locationNames.length)];
            
            // Generate random percentages for causes
            const analysisData = causes.slice(0, 4 + Math.floor(Math.random() * 2)) // 4-5 causes
                .map(cause => ({
                    name: cause.name,
                    percentage: Math.floor(Math.random() * (cause.max - cause.min) + cause.min)
                }))
                .sort((a, b) => b.percentage - a.percentage);
            
            const severityClass = `severity-${level}`;
            const timestamp = new Date().toLocaleTimeString();
            
            radarContent.innerHTML = `
                <div class="radar-section">
                    <div class="radar-title">📍 LOCATION</div>
                    <div class="cause-item">
                        <span class="cause-name">${locationName}</span>
                        <span class="scanning-line">● SCANNING</span>
                    </div>
                </div>
                
                <div class="radar-section">
                    <div class="radar-title">⚠️ SEVERITY</div>
                    <div class="cause-item">
                        <span class="cause-name">Congestion Level</span>
                        <span class="cause-percentage ${severityClass}">${level.toUpperCase()}</span>
                    </div>
                </div>
                
                <div class="radar-section">
                    <div class="radar-title">🔍 ROOT CAUSE ANALYSIS</div>
                    ${analysisData.map(item => `
                        <div class="cause-item">
                            <span class="cause-name">${item.name}</span>
                            <span class="cause-percentage">${item.percentage}%</span>
                        </div>
                    `).join('')}
                </div>
                
                <div class="radar-section">
                    <div class="radar-title">⏱️ LAST SCAN</div>
                    <div class="cause-item">
                        <span class="cause-name">Timestamp</span>
                        <span class="cause-percentage">${timestamp}</span>
                    </div>
                </div>
            `;
            
            radarWindow.style.display = 'block';
            updateRadarPosition(x, y);
        }

        function updateRadarPosition(x, y) {
            const radarWindow = document.getElementById('radarWindow');
            
            // Position the window near the cursor but keep it on screen
            let posX = x + 15;
            let posY = y - 10;
            
            // Adjust if window would go off screen
            const windowRect = radarWindow.getBoundingClientRect();
            if (posX + windowRect.width > window.innerWidth) {
                posX = x - windowRect.width - 15;
            }
            if (posY + windowRect.height > window.innerHeight) {
                posY = y - windowRect.height - 10;
            }
            if (posY < 0) posY = 10;
            if (posX < 0) posX = 10;
            
            radarWindow.style.left = posX + 'px';
            radarWindow.style.top = posY + 'px';
        }

        function hideRadarWindow() {
            document.getElementById('radarWindow').style.display = 'none';
            hoveredMesh = null;
        }

        // Load world map data
        async function loadWorldMap() {
            try {
                const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json');
                const topology = await response.json();
                
                // Convert TopoJSON to GeoJSON using topojson library
                const countries = topojson.feature(topology, topology.objects.land);
                
                drawMap(countries);
                updateStatus('Map loaded - Monitoring congestion...');
                
                // Start congestion simulation
                startCongestionSimulation();
            } catch (error) {
                console.error('Error loading map:', error);
                updateStatus('Error loading map data');
                
                // Fallback: create a simple test geometry
                createFallbackMap();
            }
        }
        
        function createFallbackMap() {
            // Create some test rectangles as fallback
            const testRegions = [
                { coords: [[-100, 40], [-80, 40], [-80, 20], [-100, 20]], level: 'critical' },
                { coords: [[0, 50], [20, 50], [20, 30], [0, 30]], level: 'high' },
                { coords: [[100, 20], [120, 20], [120, 0], [100, 0]], level: 'medium' },
                { coords: [[-50, -20], [-30, -20], [-30, -40], [-50, -40]], level: 'low' }
            ];
            
            testRegions.forEach((region, index) => {
                const shape = new THREE.Shape();
                region.coords.forEach((coord, i) => {
                    if (i === 0) {
                        shape.moveTo(coord[0], coord[1]);
                    } else {
                        shape.lineTo(coord[0], coord[1]);
                    }
                });
                
                const geometry = new THREE.ShapeGeometry(shape);
                const material = new THREE.MeshBasicMaterial({ 
                    color: congestionColors[region.level],
                    transparent: true,
                    opacity: 0.7,
                    side: THREE.DoubleSide
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                mesh.userData = {
                    countryId: index,
                    originalColor: new THREE.Color().copy(congestionColors[region.level]),
                    currentColor: new THREE.Color().copy(congestionColors[region.level]),
                    targetColor: congestionColors[region.level],
                    congestionLevel: region.level,
                    hasDevices: region.level !== 'low'
                };
                
                mapGroup.add(mesh);
                countryMeshes.push(mesh);
            });
            
            updateStatus('Fallback map loaded - Monitoring congestion...');
            startCongestionSimulation();
        }

        function drawMap(geojson) {
            geojson.features.forEach((feature, index) => {
                if (feature.geometry.type === 'Polygon') {
                    createCountryMesh(feature.geometry.coordinates, index);
                } else if (feature.geometry.type === 'MultiPolygon') {
                    feature.geometry.coordinates.forEach((polygon, polyIndex) => {
                        createCountryMesh(polygon, index * 1000 + polyIndex);
                    });
                }
            });
        }

        function createCountryMesh(coordinates, id) {
            coordinates.forEach(ring => {
                if (ring.length < 3) return;
                
                // Filter and validate coordinates
                const validCoords = ring.filter(coord => {
                    const [lng, lat] = coord;
                    return lng >= -180 && lng <= 180 && lat >= -90 && lat <= 90;
                });
                
                if (validCoords.length < 3) return;
                
                // Split polygons that cross the antimeridian (180/-180 longitude)
                const polygonGroups = splitAntimeridianPolygon(validCoords);
                
                polygonGroups.forEach(coordGroup => {
                    if (coordGroup.length < 3) return;
                    
                    const shape = new THREE.Shape();
                    
                    coordGroup.forEach((coord, index) => {
                        const [lng, lat] = coord;
                        const x = lng;
                        const y = lat;
                        
                        if (index === 0) {
                            shape.moveTo(x, y);
                        } else {
                            shape.lineTo(x, y);
                        }
                    });
                    
                    try {
                        // Randomly determine if this region has devices (70% chance)
                        const hasDevices = Math.random() > 0.3;
                        let initialColor, initialLevel;
                        
                        if (hasDevices) {
                            // Region has devices - assign random congestion level
                            const activeLevels = ['medium', 'high', 'critical'];
                            initialLevel = activeLevels[Math.floor(Math.random() * activeLevels.length)];
                            initialColor = congestionColors[initialLevel];
                        } else {
                            // No devices - gray
                            initialLevel = 'low';
                            initialColor = congestionColors['low']; // Gray
                        }
                        
                        // Create filled geometry
                        const geometry = new THREE.ShapeGeometry(shape);
                        const material = new THREE.MeshBasicMaterial({ 
                            color: initialColor,
                            transparent: true,
                            opacity: hasDevices ? 0.7 : 0.3,
                            side: THREE.DoubleSide
                        });
                        
                        const mesh = new THREE.Mesh(geometry, material);
                        mesh.userData = { 
                            countryId: id, 
                            originalColor: new THREE.Color().copy(initialColor),
                            currentColor: new THREE.Color().copy(initialColor),
                            targetColor: initialColor,
                            congestionLevel: initialLevel,
                            hasDevices: hasDevices
                        };
                        
                        mapGroup.add(mesh);
                        countryMeshes.push(mesh);
                    } catch (error) {
                        // Skip problematic geometries
                        console.warn('Skipping invalid geometry:', error);
                    }
                });
            });
        }

        function splitAntimeridianPolygon(coordinates) {
            const groups = [];
            let currentGroup = [];
            
            for (let i = 0; i < coordinates.length; i++) {
                const [lng, lat] = coordinates[i];
                const prevCoord = i > 0 ? coordinates[i - 1] : null;
                
                if (prevCoord) {
                    const [prevLng] = prevCoord;
                    // Check for large longitude jumps (likely antimeridian crossing)
                    if (Math.abs(lng - prevLng) > 180) {
                        // End current group and start new one
                        if (currentGroup.length > 2) {
                            groups.push([...currentGroup]);
                        }
                        currentGroup = [[lng, lat]];
                        continue;
                    }
                }
                
                currentGroup.push([lng, lat]);
            }
            
            // Add the last group
            if (currentGroup.length > 2) {
                groups.push(currentGroup);
            }
            
            return groups.length > 0 ? groups : [coordinates];
        }

        function startCongestionSimulation() {
            // Change congestion level every 4 seconds
            setInterval(() => {
                const randomLevel = congestionLevels[Math.floor(Math.random() * congestionLevels.length)];
                setCongestionLevel(randomLevel);
            }, 4000);
            
            // Initial random assignments to different countries
            setInterval(() => {
                assignRandomCongestion();
            }, 6000);
        }

        function setCongestionLevel(level) {
            if (congestionColors[level]) {
                currentCongestionLevel = level;
                targetColor = congestionColors[level];
                updateStatus(`Global congestion level: ${level.toUpperCase()}`);
            }
        }

        function assignRandomCongestion() {
            // Update congestion for regions that have devices
            countryMeshes.forEach(mesh => {
                if (mesh.userData.hasDevices) {
                    // Only change congestion for regions with devices
                    const activeLevels = ['medium', 'high', 'critical'];
                    const randomLevel = activeLevels[Math.floor(Math.random() * activeLevels.length)];
                    mesh.userData.targetColor = congestionColors[randomLevel];
                    mesh.userData.congestionLevel = randomLevel;
                }
                // Gray regions (no devices) remain unchanged
            });
        }

        function updateStatus(message) {
            const statusElement = document.getElementById('status');
            const indicator = `<span class="congestion-indicator" style="background-color: ${targetColor.getStyle()}"></span>`;
            statusElement.innerHTML = indicator + message;
        }

        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.02;
            
            // Smooth rotation
            rotationX += (targetRotationX - rotationX) * 0.05;
            rotationY += (targetRotationY - rotationY) * 0.05;
            mapGroup.rotation.x = rotationX;
            mapGroup.rotation.y = rotationY;
            
            // Global breathing effect
            const globalPulse = 0.6 + 0.4 * Math.sin(time * 2);
            currentColor.lerp(targetColor, 0.02);
            
            // Update country colors with breathing effect
            countryMeshes.forEach((mesh, index) => {
                if (mesh.userData.hasDevices) {
                    // Regions with devices - apply breathing effect
                    const phase = (index * 0.1) % (Math.PI * 2);
                    const localPulse = 0.5 + 0.5 * Math.sin(time * 1.5 + phase);
                    
                    // Smooth color transitions
                    mesh.userData.currentColor.lerp(mesh.userData.targetColor, 0.03);
                    const color = mesh.userData.currentColor.clone();
                    
                    // Apply breathing effect
                    color.multiplyScalar(globalPulse * localPulse);
                    mesh.material.color.copy(color);
                    mesh.material.opacity = 0.4 + 0.3 * localPulse;
                } else {
                    // No devices - keep static gray
                    mesh.material.color.setHex(0x888888);
                    mesh.material.opacity = 0.3;
                }
            });
            
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize
        loadWorldMap();
        animate();
    </script>
</body>
</html>
