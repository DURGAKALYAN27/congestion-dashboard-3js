<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>World Network Monitor</title>
    <!-- Chart.js for Level 3 Dashboard -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
    <!-- Font Awesome for diagram icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <!-- D3.js for dynamic graph layout -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas { 
            display: block; 
            transition: filter 0.5s ease;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }
        .congestion-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        /* Radar Analysis Window */
        #radarWindow {
            position: absolute;
            background: rgba(0, 20, 40, 0.95);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 15px;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            display: none;
            z-index: 1000;
            min-width: 280px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .radar-header { color: #ffffff; font-weight: bold; margin-bottom: 10px; text-align: center; border-bottom: 1px solid #00ffff; padding-bottom: 5px; }
        .radar-section { margin-bottom: 8px; }
        .radar-title { color: #ffff00; font-weight: bold; margin-bottom: 3px; }
        .cause-item { display: flex; justify-content: space-between; margin: 2px 0; padding: 2px 0; }
        .cause-name { color: #ffffff; }
        .cause-percentage { color: #ff6666; font-weight: bold; }
        .severity-critical { color: #ff3333; }
        .severity-high { color: #ff8800; }
        .severity-medium { color: #ffff00; }
        .radar-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        .scanning-line { color: #00ff00; animation: blink 1s infinite; }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0.3; } }

        /* --- Level 3 Datacenter View --- */
        #level3Overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0d1117; z-index: 2000; color: #c9d1d9;
            display: none; flex-direction: column; font-family: 'Courier New', monospace;
        }
        .l3-main-header {
            background: #161b22; padding: 10px 20px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .l3-tabs { display: flex; gap: 10px;}
        .l3-tab { padding: 8px 15px; border-bottom: 3px solid transparent; cursor: pointer; color: #8b949e; }
        .l3-tab.active { border-bottom-color: #f78166; color: #f0f6fc; font-weight: 600; }
        .l3-close-btn { background: #c9302c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .l3-close-btn:hover { background: #d9534f; }
        .l3-content-wrapper { flex-grow: 1; display: flex; padding: 15px; gap: 15px; overflow: hidden; }
        .l3-main-panel { flex-grow: 1; display: flex; flex-direction: column; background: #161b22; border: 1px solid #30363d; border-radius: 6px; }
        .l3-main-panel-header { padding: 10px 15px; border-bottom: 1px solid #30363d; font-weight: 600; color: #f0f6fc; }
        .l3-network-map { flex-grow: 1; position: relative; background: #0d1117; padding: 5px; display: flex; align-items: center; justify-content: center;}
        
        .l3-right-panel {
            flex-basis: 320px; flex-shrink: 0; background: #161b22; border: 1px solid #30363d;
            border-radius: 6px; padding: 15px; font-size: 14px; color: #c9d1d9;
        }
        .l3-right-panel h3 { margin: 0 0 20px 0; font-size: 16px; border-bottom: 1px solid #30363d; padding-bottom: 10px; color: #f0f6fc; font-weight: 600;}
        .l3-insight-item { margin-bottom: 25px; }
        .l3-insight-title { color: #00ffff; font-size: 16px; margin: 0 0 8px 0; font-weight: bold; }
        .l3-insight-text { line-height: 1.5; font-size: 14px; }
        
        .l3-connection-line { stroke-width: 1.5px; fill: none; stroke: #8b949e; }
        
        .l3-charts-container { flex-shrink: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 0 15px 15px 15px; height: 160px; }
        .l3-chart-wrapper { background: #161b22; padding: 10px; border: 1px solid #30363d; border-radius: 6px; }
        
        /* --- Network Diagram Styles (for dynamically generated nodes) --- */
        .nd-node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #c9d1d9;
            cursor: grab;
            transition: transform 0.2s ease;
            z-index: 10;
        }
        .nd-node:active { cursor: grabbing; }
        .nd-node.clickable { cursor: pointer; }

        .nd-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s ease;
            position: relative; 
        }
        .nd-icon.fa-server { font-size: 32px; }
        .nd-icon.fa-shield-alt { font-size: 32px; }
        .nd-icon.fa-network-wired { font-size: 32px; } /* PFS icon */
        .nd-icon.fa-cloud { font-size: 36px; }
        .nd-icon.fa-database { font-size: 28px; }
        .nd-icon.fa-hard-drive { font-size: 28px; } /* InfiniStream icon */
        .nd-label {
            font-size: 11px;
            margin-top: 4px;
            text-align: center;
            white-space: normal;
            max-width: 90px;
            line-height: 1.2;
        }
        .diagram-status-message {
            font-size: 16px;
            color: #8b949e;
            text-align: center;
        }
        .diagram-status-message .error-details {
            font-size: 12px;
            color: #f85149;
            margin-top: 10px;
            max-width: 400px;
            word-break: break-all;
        }

        /* --- Node Status Visualization --- */
        @keyframes pulse-ring {
            0% { transform: scale(0.6); opacity: 1; }
            80%, 100% { transform: scale(2.2); opacity: 0; }
        }

        .nd-icon::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin: -20px 0 0 -20px;
            border-radius: 50%;
            display: block;
            z-index: -1;
            animation: pulse-ring 2s ease-out infinite;
            animation-play-state: paused;
            border: 3px solid transparent;
        }

        .nd-node.status-healthy .nd-icon { color: #58a6ff; }
        .nd-node.status-warning .nd-icon { color: #f0ad4e; }
        .nd-node.status-critical .nd-icon { color: #f85149; }
        
        .nd-node.status-critical .nd-icon::before {
            border-color: rgba(248, 81, 73, 0.7);
            animation-play-state: running;
        }
        .nd-node.status-warning .nd-icon::before {
            border-color: rgba(240, 173, 78, 0.5);
            animation: pulse-ring 3s ease-out infinite;
            animation-play-state: running;
        }
        
        /* L3 Radar Analysis Window */
        #l3-radar-window {
            position: absolute;
            background: rgba(13, 17, 23, 0.97);
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            display: none;
            z-index: 2500;
            min-width: 280px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        #l3-radar-window .radar-header { color: #f0f6fc; font-weight: 600; margin-bottom: 10px; text-align: center; border-bottom: 1px solid #30363d; padding-bottom: 8px; font-size: 13px; }
        #l3-radar-window .radar-section { margin-bottom: 8px; }
        #l3-radar-window .radar-title { color: #8b949e; font-weight: bold; margin-bottom: 4px; text-transform: uppercase; font-size: 10px; }
        #l3-radar-window .cause-item { display: flex; justify-content: space-between; margin: 2px 0; padding: 3px 0; }
        #l3-radar-window .cause-name { color: #c9d1d9; }
        #l3-radar-window .cause-percentage { font-weight: bold; }
        #l3-radar-window .severity-critical { color: #f85149; }
        #l3-radar-window .severity-warning { color: #f0ad4e; }
        #l3-radar-window .radar-pulse { animation: pulse 2s infinite; }
        #l3-radar-window .scanning-line { color: #238636; animation: blink 1.2s infinite; }

        /* --- Level 4 Switch View --- */
        #level4Overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(5px);
            z-index: 3000; color: #c9d1d9;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
        }
        .l4-panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            width: 800px;
            height: 550px;
            display: flex;
            flex-direction: column;
        }
        .l4-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; margin-bottom: 15px;}
        .l4-title { font-size: 18px; font-weight: 600; color: #f0f6fc;}
        .l4-close-btn { background: #c9302c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .l4-close-btn:hover { background: #d9534f; }
        
        .l4-content { flex-grow: 1; position: relative; }
        .l4-switch-box {
            position: absolute;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
            color: #8b949e;
            font-size: 14px;
            z-index: 10;
        }
        .l4-port-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
        }
        .l4-port-socket {
            width: 20px;
            height: 20px;
            background-color: #010409;
            border: 1px solid #30363d;
            position: relative;
        }
        .l4-port-socket::after {
            content: attr(data-port);
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #8b949e;
        }
        .l4-connection-line-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .l4-line { 
            stroke-width: 2; 
            stroke: #30363d;
        }
        .l4-line.status-healthy { stroke: #58a6ff; }
        .l4-line.status-warning { stroke: #f0ad4e; }
        .l4-line.status-critical { stroke: #f85149; }
        
    </style>
</head>
<body>
    <div id="info">
        <div>World Network Monitor</div>
        <div id="status">Loading... (Double-click to reset view)</div>
    </div>
    
    <div id="radarWindow">
        <div class="radar-header radar-pulse">🔍 NETWORK RADAR ANALYSIS</div>
        <div id="radarContent"></div>
    </div>

    <!-- Level 3 Datacenter View Overlay -->
    <div id="level3Overlay">
        <header class="l3-main-header">
            <div class="l3-tabs">
                <div class="l3-tab">Dashboard</div>
                <div class="l3-tab active">Network Dashboard</div>
                <div class="l3-tab">Events</div>
            </div>
            <button id="l3-close-btn" class="l3-close-btn">Return to Map</button>
        </header>
        <div class="l3-content-wrapper">
            <div class="l3-main-panel">
                <div class="l3-main-panel-header">
                    <span id="l3-title">Network Flow Map</span>
                </div>
                <div class="l3-network-map">
                    <svg width="100%" height="100%" id="l3-svg-container" style="position: absolute; top: 0; left: 0;"></svg>
                    <div id="l3-nodes-container" style="position: relative; width: 100%; height: 100%;"></div>
                </div>
            </div>
            <aside class="l3-right-panel">
                <h3>System Insights</h3>
                <div id="l3-ml-insights-content"></div>
            </aside>
        </div>
        <div class="l3-charts-container">
            <div class="l3-chart-wrapper"><canvas id="l3-chart-throughput"></canvas></div>
            <div class="l3-chart-wrapper"><canvas id="l3-chart-tcploss"></canvas></div>
            <div class="l3-chart-wrapper"><canvas id="l3-chart-pie"></canvas></div>
            <div class="l3-chart-wrapper"><canvas id="l3-chart-errors"></canvas></div>
        </div>
        <div id="l3-radar-window"></div>
    </div>

    <!-- Level 4 Switch View Overlay -->
    <div id="level4Overlay">
        <div class="l4-panel">
            <header class="l4-header">
                <div id="l4-title" class="l4-title">Switch Port Analysis</div>
                <button id="l4-close-btn" class="l4-close-btn">Return to Diagram</button>
            </header>
            <div id="l4-content" class="l4-content">
                <!-- Diagram will be dynamically generated here -->
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    
    <script>
        // --- THREE.JS Setup and Global Variables ---
        const scene = new THREE.Scene();
        const initialCameraPosition = new THREE.Vector3(0, 0, 120);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.copy(initialCameraPosition);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000011);
        document.body.appendChild(renderer.domElement);

        // --- State and Controls ---
        let mouseDown = false;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;
        let rotationX = 0, rotationY = 0;
        let currentLevel = 1; // 1: Global, 2: Regional, 3: Datacenter Diagram, 4: Switch View
        let targetCameraPosition = new THREE.Vector3().copy(initialCameraPosition);
        let currentLookAt = new THREE.Vector3(0, 0, 0);
        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let activeCharts = []; // To hold Chart.js instances
        let animationState = 'idle'; // 'idle', 'centering', 'zooming'
        let zoomTargetMesh = null;
        let currentGraphData = null; // To store L3 graph data for L4 view


        // --- Groups for objects ---
        const mapGroup = new THREE.Group();
        const globalConnectionsGroup = new THREE.Group();
        const indiaConnectionsGroup = new THREE.Group();
        mapGroup.add(globalConnectionsGroup);
        mapGroup.add(indiaConnectionsGroup);
        scene.add(mapGroup);
        indiaConnectionsGroup.visible = false;

        // --- Raycasting ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- Data & Configuration ---
        const congestionLevels = ['low', 'medium', 'high', 'critical'];
        const activeLevels = ['medium', 'high', 'critical'];
        const congestionColors = {
            "low": new THREE.Color(0x888888), "medium": new THREE.Color(0xffff00),
            "high": new THREE.Color(0xff8800), "critical": new THREE.Color(0xff0000), "unknown": new THREE.Color(0x444444)
        };
        let targetColor = congestionColors['low'];
        let time = 0;
        let countryMeshes = [];
        let hoveredMesh = null;
        const congestionCauses = {
            'critical': [ { name: 'Faulty Hardware or Cables', min: 75, max: 95 }, { name: 'Traffic Overload', min: 60, max: 85 }, { name: 'Oversubscription', min: 40, max: 70 }, { name: 'Buffer Bloat', min: 30, max: 60 }, { name: 'Inadequate QoS (Quality of Service)', min: 25, max: 50 }, { name: 'Misconfigured Load Balancers or Routing', min: 20, max: 45 }, { name: 'Slow-Receiver or End Device', min: 15, max: 40 }, { name: 'Microbursts', min: 10, max: 35 } ],
            'high': [ { name: 'Traffic Overload', min: 50, max: 75 }, { name: 'Buffer Bloat', min: 35, max: 65 }, { name: 'Oversubscription', min: 30, max: 55 }, { name: 'Slow-Receiver or End Device', min: 25, max: 50 }, { name: 'Inadequate QoS (Quality of Service)', min: 20, max: 45 }, { name: 'Misconfigured Load Balancers or Routing', min: 15, max: 35 }, { name: 'Faulty Hardware or Cables', min: 10, max: 30 }, { name: 'Microbursts', min: 8, max: 25 } ],
            'medium': [ { name: 'Traffic Overload', min: 30, max: 50 }, { name: 'Buffer Bloat', min: 20, max: 40 }, { name: 'Slow-Receiver or End Device', min: 15, max: 35 }, { name: 'Inadequate QoS (Quality of Service)', min: 10, max: 30 }, { name: 'Microbursts', min: 8, max: 25 }, { name: 'Oversubscription', min: 5, max: 20 }, { name: 'Misconfigured Load Balancers or Routing', min: 5, max: 18 }, { name: 'Faulty Hardware or Cables', min: 3, max: 15 } ]
        };
        const deviceFailureCauses = {
            'critical': [
                { name: 'CPU Utilization', min: 95, max: 100, unit: '%' }, { name: 'Memory Leak Detected', min: 80, max: 95, unit: '%' },
                { name: 'Packet Drop Rate', min: 20, max: 50, unit: '%' }, { name: 'PSU Voltage Fluctuation', min: 15, max: 25, unit: '%' },
                { name: 'Disk I/O Wait', min: 70, max: 90, unit: '%' },
            ],
            'warning': [
                { name: 'CPU Utilization', min: 80, max: 94, unit: '%' }, { name: 'High Memory Usage', min: 75, max: 90, unit: '%' },
                { name: 'Packet Drop Rate', min: 5, max: 19, unit: '%' }, { name: 'High Latency', min: 150, max: 300, unit: 'ms' },
                { name: 'Disk Space Low', min: 85, max: 95, unit: '%' },
            ]
        };
        const locationNames = [ 'Data Center Alpha', 'Regional Hub Beta', 'Metro Node Gamma', 'Edge Router Delta', 'Core Switch Epsilon' ];
        const genericInsights = {
            mlInsights: [
                { title: 'System Status', text: 'All systems are reporting nominal performance. No active alerts.' },
                { title: 'Security Posture', text: 'Firewall is actively filtering traffic. No intrusion attempts detected in the last hour.' },
                { title: 'Connectivity Health', text: 'External and internal network links show stable latency and packet delivery.' }
            ]
        };

        // --- Event Listeners Setup ---
        document.addEventListener('mousedown', onMouseDown, false);
        document.addEventListener('mousemove', onMouseMove, false);
        document.addEventListener('mouseup', onMouseUp, false);
        document.addEventListener('wheel', onWheel, false);
        document.addEventListener('dblclick', resetView, false);
        document.getElementById('l3-close-btn').addEventListener('click', hideLevel3View);
        document.getElementById('l4-close-btn').addEventListener('click', hideLevel4View);

        // --- Core Event Handlers ---
        function onMouseDown(event) { if (currentLevel >= 3) return; mouseDown = true; mouseX = event.clientX; mouseY = event.clientY; }
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            if (!mouseDown) { if (currentLevel === 1) checkHover(event); return; }
            if (currentLevel !== 1 || animationState !== 'idle') return;
            const deltaX = event.clientX - mouseX; const deltaY = event.clientY - mouseY;
            targetRotationY += deltaX * 0.01; targetRotationX += deltaY * 0.01;
            targetRotationX = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotationX));
            mouseX = event.clientX; mouseY = event.clientY;
        }
        function onMouseUp(event) {
            if (!mouseDown || currentLevel >= 3) return; mouseDown = false;
            const deltaX = event.clientX - mouseX; const deltaY = event.clientY - mouseY;
            const dragDistance = Math.sqrt(deltaX*deltaX + deltaY*deltaY);
            if (dragDistance < 5) handleClick();
        }
        function handleClick() {
            if (animationState !== 'idle') return; raycaster.setFromCamera(mouse, camera);
            if (currentLevel === 1) {
                const intersects = raycaster.intersectObjects(countryMeshes);
                if (intersects.length > 0 && intersects[0].object.userData.name === 'India') zoomToCountry(intersects[0].object);
            } else if (currentLevel === 2) {
                const nodeIntersects = raycaster.intersectObjects(indiaConnectionsGroup.children);
                const countryIntersects = raycaster.intersectObjects(countryMeshes);
                const clickedNode = nodeIntersects.find(i => i.object.userData.isNode);
                if (clickedNode) showLevel3View(clickedNode.object.userData.name);
                else if (countryIntersects.length === 0) resetView();
            }
        }
        function zoomToCountry(countryMesh) {
            if (currentLevel !== 1 || animationState !== 'idle') return;
            hideRadarWindow(); animationState = 'centering'; zoomTargetMesh = countryMesh; targetRotationX = 0; targetRotationY = 0;
        }
        function resetView() {
            if (currentLevel === 1 && camera.position.equals(initialCameraPosition)) return;
            hideLevel4View(); // Close L4 first
            hideLevel3View(); // Then close L3
            currentLevel = 1; targetCameraPosition.copy(initialCameraPosition); targetLookAt.set(0, 0, 0);
            globalConnectionsGroup.visible = true; indiaConnectionsGroup.visible = false;
            animationState = 'idle'; zoomTargetMesh = null; updateStatus('Global View. Monitoring all networks.');
        }
        function onWheel(event) {
            if (currentLevel !== 1) return; camera.position.z += event.deltaY * 0.1;
            camera.position.z = Math.max(50, Math.min(300, camera.position.z)); targetCameraPosition.z = camera.position.z;
        }
        
        // --- Radar Window Functions ---
        function checkHover(event) {
            if (animationState !== 'idle') return; raycaster.setFromCamera(mouse, camera); const intersects = raycaster.intersectObjects(countryMeshes);
            if (intersects.length > 0) {
                const mesh = intersects[0].object;
                if (mesh.userData.hasDevices && (mesh.userData.congestionLevel === 'high' || mesh.userData.congestionLevel === 'critical')) {
                    if (hoveredMesh !== mesh) { hoveredMesh = mesh; showRadarWindow(event.clientX, event.clientY, mesh); }
                    else { updateRadarPosition(event.clientX, event.clientY); }
                } else { hideRadarWindow(); }
            } else { hideRadarWindow(); }
        }
        function showRadarWindow(x, y, mesh) {
            const radarWindow = document.getElementById('radarWindow'); const radarContent = document.getElementById('radarContent');
            const level = mesh.userData.congestionLevel; const causes = congestionCauses[level] || [];
            const locationName = locationNames[Math.floor(Math.random() * locationNames.length)];
            const analysisData = causes.slice(0, 4 + Math.floor(Math.random() * 2)).map(c => ({ name: c.name, percentage: Math.floor(Math.random()*(c.max-c.min)+c.min) })).sort((a, b) => b.percentage - a.percentage);
            const severityClass = `severity-${level}`; const timestamp = new Date().toLocaleTimeString();

        function renderDynamicDiagram(graph) {
            const nodesContainer = document.getElementById('l3-nodes-container');
            const svg = d3.select("#l3-svg-container");
            const mapContainer = document.querySelector('.l3-network-map');

            nodesContainer.innerHTML = ''; 
            
            const width = mapContainer.clientWidth;
            const height = mapContainer.clientHeight;

            const simulation = d3.forceSimulation(graph.nodes)
                .force("link", d3.forceLink(graph.links).id(d => d.id).distance(120).strength(1.0))
                .force("charge", d3.forceManyBody().strength(-400))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("x", d3.forceX(width / 2).strength(0.1))
                .force("y", d3.forceY(height / 2).strength(0.1));

            const node = d3.select(nodesContainer)
                .selectAll("div.nd-node")
                .data(graph.nodes)
                .enter()
                .append("div")
                .attr("class", d => {
                    let classes = `nd-node status-${d.status || 'healthy'}`;
                    if (d.id.includes('Packet_Flow_Switch')) {
                        classes += ' clickable';
                    }
                    return classes;
                })
                .html(d => {
                    const iconClass = getIconForNode(d.id);
                    return `<div class="nd-icon ${iconClass}"><i class="${iconClass}"></i></div>
                            <div class="nd-label">${d.id.replace(/_/g, ' ')}</div>`; 
                })
                .on('mouseenter', (event, d) => showL3RadarWindow(event, d))
                .on('mousemove', (event) => updateL3RadarPosition(event))
                .on('mouseleave', () => hideL3RadarWindow())
                .on('click', (event, d) => { // Click handler for L4
                    if (d.id.includes('Packet_Flow_Switch')) {
                        showLevel4View();
                    }
                })
                .call((selection) => {
                    selection.each(function(d) {
                        if (!d.id.includes('Packet_Flow_Switch')) {
                            d3.select(this).call(
                                d3.drag()
                                .on("start", dragstarted)
                                .on("drag", dragged)
                                .on("end", dragended)
                            );
                        } else {
                            this.style.cursor = 'pointer';
                        }
                    });
                });
            
            const link = svg.append("g")
                .selectAll("line")
                .data(graph.links)
                .enter().append("line").attr("class", "l3-connection-line");

            simulation.on("tick", () => {
                link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                node.style("left", d => `${d.x}px`).style("top", d => `${d.y}px`).style("transform", "translate(-50%, -50%)");
            });

            function dragstarted(event, d) { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
            function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
            function dragended(event, d) { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }
        }

        // --- Level 4 ---
        function showLevel4View() {
            if (!currentGraphData) return;
            currentLevel = 4;

            const overlay = document.getElementById('level4Overlay');
            const content = document.getElementById('l4-content');
            content.innerHTML = '';
            overlay.style.display = 'flex';

            setTimeout(() => {
                const switchNode = currentGraphData.nodes.find(n => n.id.includes('Packet_Flow_Switch'));
                if (!switchNode) {
                    content.innerHTML = `<div class="diagram-status-message">Error: Packet Flow Switch not found in data.</div>`;
                    return;
                }

                const contentRect = content.getBoundingClientRect();
                const panelWidth = contentRect.width;
                const panelHeight = contentRect.height;
                const switchPos = { x: panelWidth / 2, y: panelHeight / 2 };

                const connectedLinks = currentGraphData.links.filter(l =>
                    (l.source && l.source.id === switchNode.id) ||
                    (l.target && l.target.id === switchNode.id)
                );
                const connectedDevices = connectedLinks.map(link => {
                    const deviceId = (link.source.id === switchNode.id) ? link.target.id : link.source.id;
                    return currentGraphData.nodes.find(n => n.id === deviceId);
                }).filter(Boolean);

                let availablePorts = [1, 2, 3, 4, 5, 6, 7, 8];
                for (let i = availablePorts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [availablePorts[i], availablePorts[j]] = [availablePorts[j], availablePorts[i]];
                }

                const container = document.createElement('div');
                container.style.position = 'relative';
                container.style.width = '100%';
                container.style.height = '100%';
                
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.classList.add('l4-connection-line-svg');
                // Set SVG to cover the entire container
                svg.style.position = 'absolute';
                svg.style.top = '0';
                svg.style.left = '0';
                svg.style.width = '100%';
                svg.style.height = '100%';
                svg.style.pointerEvents = 'none';
                svg.style.zIndex = '10'; // Higher z-index to appear above the switch

                const switchWidth = 300;
                const switchHeight = 120;
                
                function getPortPosition(portNumber) {
                    const numPortsTop = 4;
                    const numPortsBottom = 4;
                    const totalWidthForPorts = 220; // A bit less than the switch width for padding
                    const horizontalSpacing = totalWidthForPorts / (numPortsTop - 1);
                    const topOffset = 0;       // <-- move top row slightly down
                    const bottomOffset = 35;    // <-- keep bottom row as is
                    const startX = switchPos.x - totalWidthForPorts / 2;

                    if (portNumber >= 1 && portNumber <= numPortsTop) {
                        return {
                            x: startX + horizontalSpacing * (portNumber - 1),
                            y: switchPos.y - topOffset
                        };
                    } else if (portNumber > numPortsTop && portNumber <= numPortsTop + numPortsBottom) {
                        return {
                            x: startX + horizontalSpacing * (portNumber - numPortsTop - 1),
                            y: switchPos.y + bottomOffset
                        };
                    }

                    return switchPos; // fallback to center if invalid port
                }
                
                const devicePositions = [
                    { x: switchPos.x - 250, y: 80 }, { x: switchPos.x, y: 80 }, { x: switchPos.x + 250, y: 80 },
                    { x: switchPos.x - 250, y: panelHeight - 80 }, { x: switchPos.x, y: panelHeight - 80 }, { x: switchPos.x + 250, y: panelHeight - 80 },
                    { x: 120, y: panelHeight / 2}, { x: panelWidth - 120, y: panelHeight / 2}
                ];

                const switchBox = document.createElement('div');
                switchBox.className = 'l4-switch-box';
                switchBox.style.width = `${switchWidth}px`;
                switchBox.style.height = `${switchHeight}px`;
                switchBox.style.left = `${switchPos.x - switchWidth / 2}px`;
                switchBox.style.top = `${switchPos.y - switchHeight / 2}px`;
                switchBox.style.position = 'absolute';
                switchBox.style.zIndex = '5'; // Lower z-index so lines appear above
                
                let portsHTML = '<span>SWITCH</span><div class="l4-port-row">';
                for (let i = 1; i <= 4; i++) portsHTML += `<div class="l4-port-socket" data-port="${i}"></div>`;
                portsHTML += '</div><div class="l4-port-row">';
                for (let i = 5; i <= 8; i++) portsHTML += `<div class="l4-port-socket" data-port="${i}"></div>`;
                portsHTML += '</div>';
                switchBox.innerHTML = portsHTML;
                
                // Add SVG first (bottom layer), then switch box
                container.appendChild(svg);
                container.appendChild(switchBox);

                connectedDevices.forEach((device, index) => {
                    if (index >= devicePositions.length || availablePorts.length === 0) return;

                    const assignedPort = availablePorts.pop(); 
                    const portPos = getPortPosition(assignedPort);
                    const devicePos = devicePositions[index];

                    const iconClass = getIconForNode(device.id);
                    const nodeEl = document.createElement('div');
                    nodeEl.className = `nd-node status-${device.status || 'healthy'}`;
                    nodeEl.style.position = 'absolute';
                    nodeEl.style.left = `${devicePos.x}px`;
                    nodeEl.style.top = `${devicePos.y}px`;
                    nodeEl.style.transform = 'translate(-50%, -50%)';
                    nodeEl.style.zIndex = '15'; // Highest z-index for devices
                    nodeEl.innerHTML = `<div class="nd-icon ${iconClass}"><i class="${iconClass}"></i></div><div class="nd-label">${device.id.replace(/_/g, ' ')}</div>`;
                    container.appendChild(nodeEl);
                    
                    // Draw the connection line from the port center to the device center
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', portPos.x);
                    line.setAttribute('y1', portPos.y);
                    line.setAttribute('x2', devicePos.x);
                    line.setAttribute('y2', devicePos.y);
                    line.setAttribute('class', `l4-line status-${device.status || 'healthy'}`);
                    line.setAttribute('stroke-width', '2');
                    line.setAttribute('stroke', '#00ff00'); // Default green, override with CSS
                    svg.appendChild(line);

                    // Mark the port as active to show visual connection
                    const portSocket = switchBox.querySelector(`[data-port="${assignedPort}"]`);
                    if (portSocket) {
                        portSocket.classList.add('active');
                        portSocket.style.backgroundColor = '';
                    }
                });

                content.appendChild(container);
                document.getElementById('l4-title').innerHTML = `<i class="fa-solid fa-network-wired"></i> ${switchNode.id.replace(/_/g, ' ')} - Connections`;
            }, 50);
        }

        // --- Map Loading & Drawing Functions ---
        async function loadWorldMap() {
            try {
                const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
                const topology = await response.json();
                const countries = topojson.feature(topology, topology.objects.countries);
                drawMap(countries); updateStatus('Map loaded - Monitoring congestion...'); startCongestionSimulation();
            } catch (error) { console.error('Error loading map:', error); updateStatus('Error loading map data'); }
        }
        function drawMap(geojson) {
            geojson.features.forEach((feature) => {
                if (feature.geometry.type === 'Polygon') createCountryMesh(feature.geometry.coordinates, feature.properties);
                else if (feature.geometry.type === 'MultiPolygon') feature.geometry.coordinates.forEach((polygon) => createCountryMesh(polygon, feature.properties));
            });
        }
        function splitAntimeridianPolygon(coordinates) {
            const groups = []; let currentGroup = [];
            for (let i = 0; i < coordinates.length; i++) {
                const [lng, lat] = coordinates[i]; const prevCoord = i > 0 ? coordinates[i - 1] : null;
                if (prevCoord) {
                    const [prevLng] = prevCoord;
                    if (Math.abs(lng - prevLng) > 180) { if (currentGroup.length > 2) groups.push([...currentGroup]); currentGroup = []; }
                }
                currentGroup.push([lng, lat]);
            }
            if (currentGroup.length > 2) groups.push(currentGroup); return groups.length > 0 ? groups : [coordinates];
        }
        function createCountryMesh(coordinates, properties) {
            coordinates.forEach(ring => {
                if (ring.length < 3) return; const polygonGroups = splitAntimeridianPolygon(ring);
                polygonGroups.forEach(coordGroup => {
                    if (coordGroup.length < 3) return; const shape = new THREE.Shape();
                    coordGroup.forEach(([lng, lat], index) => { if (index === 0) shape.moveTo(lng, lat); else shape.lineTo(lng, lat); });
                    const hasDevices = Math.random() > 0.3; let initialColor, initialLevel;
                    if (hasDevices) { initialLevel = activeLevels[Math.floor(Math.random() * activeLevels.length)]; initialColor = congestionColors[initialLevel]; }
                    else { initialLevel = 'low'; initialColor = congestionColors['low']; }
                    const geometry = new THREE.ShapeGeometry(shape);
                    const material = new THREE.MeshBasicMaterial({ color: initialColor, transparent: true, opacity: hasDevices ? 0.7 : 0.3, side: THREE.DoubleSide });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.userData = { name: properties.name, originalColor: new THREE.Color().copy(initialColor), currentColor: new THREE.Color().copy(initialColor), targetColor: initialColor, congestionLevel: initialLevel, hasDevices: hasDevices };
                    mapGroup.add(mesh); countryMeshes.push(mesh);
                });
            });
        }
        
        // --- Simulation & Status Update Functions  ---
        function startCongestionSimulation() { setInterval(() => { assignRandomCongestion(); }, 6000); }
        function assignRandomCongestion() { countryMeshes.forEach(mesh => { if (mesh.userData.hasDevices) { const randomLevel = activeLevels[Math.floor(Math.random() * activeLevels.length)]; mesh.userData.targetColor = congestionColors[randomLevel]; mesh.userData.congestionLevel = randomLevel; } }); }
        function updateStatus(message) { const statusElement = document.getElementById('status'); const indicator = `<span class="congestion-indicator" style="background-color: ${targetColor.getStyle()}"></span>`; statusElement.innerHTML = indicator + message; }
        function getRandomActiveColor() { const randomLevel = activeLevels[Math.floor(Math.random() * activeLevels.length)]; return congestionColors[randomLevel].clone(); }

        // --- Main Animation Loop ---
        function animate() {
            requestAnimationFrame(animate); time += 0.02;
            if (animationState === 'centering') {
                const rotationLerpFactor = 0.1; rotationX += (targetRotationX - rotationX) * rotationLerpFactor; rotationY += (targetRotationY - rotationY) * rotationLerpFactor;
                mapGroup.rotation.x = rotationX; mapGroup.rotation.y = rotationY;
                if (Math.abs(rotationX) < 0.01 && Math.abs(rotationY) < 0.01) {
                    rotationX = 0; rotationY = 0; mapGroup.rotation.x = 0; mapGroup.rotation.y = 0;
                    animationState = 'zooming'; currentLevel = 2; const boundingBox = new THREE.Box3().setFromObject(zoomTargetMesh);
                    const center = boundingBox.getCenter(new THREE.Vector3()); const size = boundingBox.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z); targetCameraPosition.copy(center).add(new THREE.Vector3(0, 0, maxDim * 1.8));
                    targetLookAt.copy(center); globalConnectionsGroup.visible = false; indiaConnectionsGroup.visible = true;
                    updateStatus(`Zoomed into: ${zoomTargetMesh.userData.name}. Click a node for details.`);
                }
            } else if (animationState === 'zooming') {
                const cameraLerpFactor = 0.15; camera.position.lerp(targetCameraPosition, cameraLerpFactor);
                currentLookAt.lerp(targetLookAt, cameraLerpFactor); camera.lookAt(currentLookAt);
                if (camera.position.distanceTo(targetCameraPosition) < 0.1) {
                    camera.position.copy(targetCameraPosition); currentLookAt.copy(targetLookAt); camera.lookAt(currentLookAt);
                    animationState = 'idle'; zoomTargetMesh = null;
                }
            } else {
                const cameraLerpFactor = 0.15; camera.position.lerp(targetCameraPosition, cameraLerpFactor);
                currentLookAt.lerp(targetLookAt, cameraLerpFactor); camera.lookAt(currentLookAt);
                if (currentLevel === 1) {
                    const rotationLerpFactor = 0.2; rotationX += (targetRotationX - rotationX) * rotationLerpFactor; rotationY += (targetRotationY - rotationY) * rotationLerpFactor;
                    mapGroup.rotation.x = rotationX; mapGroup.rotation.y = rotationY;
                }
            }
            countryMeshes.forEach((mesh, index) => {
                if (mesh.userData.hasDevices) {
                    const phase = (index * 0.1) % (Math.PI * 2); const localPulse = 0.7 + 0.3 * Math.sin(time * 0.5 + phase);
                    mesh.userData.currentColor.lerp(mesh.userData.targetColor, 0.03); const baseColor = mesh.userData.currentColor.clone();
                    const brightColor = baseColor.clone().multiplyScalar(1.3); const dimColor = baseColor.clone().multiplyScalar(0.7);
                    const breathingColor = dimColor.clone().lerp(brightColor, localPulse); mesh.material.color.copy(breathingColor);
                    mesh.material.opacity = 0.5 + 0.2 * localPulse;
                } else { mesh.material.opacity = 0.3; }
            });
            const allLines = [...globalConnectionsGroup.children, ...indiaConnectionsGroup.children].filter(c => c.type === "Line");
            allLines.forEach((line, index) => {
                const phase = (index * 0.1) % (Math.PI * 2); const localPulse = 0.7 + 0.3 * Math.sin(time * 0.5 + phase);
                line.userData.currentColor.lerp(line.userData.targetColor, 0.03); const baseColor = line.userData.currentColor.clone();
                const breathingColor = baseColor.clone().lerp(baseColor.clone().multiplyScalar(1.3), localPulse); line.material.color.copy(breathingColor);
            });
            renderer.render(scene, camera);
        }

        const indiaConnections = [ {from:{lon:73.85,lat:18.52,name:'Pune'},to:{lon:77.59,lat:12.97,name:'Bangalore'}},{from:{lon:77.59,lat:12.97,name:'Bangalore'},to:{lon:80.27,lat:13.08,name:'Chennai'}},{from:{lon:80.27,lat:13.08,name:'Chennai'},to:{lon:88.36,lat:22.57,name:'Kolkata'}},{from:{lon:88.36,lat:22.57,name:'Kolkata'},to:{lon:77.2,lat:28.61,name:'Delhi'}},{from:{lon:77.2,lat:28.61,name:'Delhi'},to:{lon:72.87,lat:19.07,name:'Mumbai'}},{from:{lon:72.87,lat:19.07,name:'Mumbai'},to:{lon:73.85,lat:18.52,name:'Pune'}},{from:{lon:77.2,lat:28.61,name:'Delhi'},to:{lon:77.59,lat:12.97,name:'Bangalore'}}, ];
        function lonLatToPlane(lon, lat) { return new THREE.Vector3(lon, lat, 0.1); }
        function createGlowingNode(position, name, group) {
            const geometry = new THREE.SphereGeometry(0.8, 16, 16); const material = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            const sphere = new THREE.Mesh(geometry, material); sphere.position.copy(position); sphere.userData = { name: name, isNode: true }; group.add(sphere);
        }
        function createConnectionLine(from, to, group) {
            const start = lonLatToPlane(from.lon, from.lat); const end = lonLatToPlane(to.lon, to.lat);
            const mid = start.clone().lerp(end, 0.5); mid.z += start.distanceTo(end) * 0.2;
            const curve = new THREE.QuadraticBezierCurve3(start, mid, end); const points = curve.getPoints(50);
            const geometry = new THREE.BufferGeometry().setFromPoints(points); const lineColor = getRandomActiveColor();
            const material = new THREE.LineBasicMaterial({ color: lineColor, linewidth: 2, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false });
            const line = new THREE.Line(geometry, material); line.userData = { currentColor: lineColor.clone(), targetColor: getRandomActiveColor() }; group.add(line);
            const nodesInGroup = group.children.filter(c => c.userData.isNode);
            if (from.name && !nodesInGroup.some(n => n.userData.name === from.name)) createGlowingNode(start, from.name, group);
            if (to.name && !nodesInGroup.some(n => n.userData.name === to.name)) createGlowingNode(end, to.name, group);
        }
